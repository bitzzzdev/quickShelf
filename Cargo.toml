[package]
name = "quick-shelf"
version = "0.1.0"
edition = "2021"
description = "Mouse-enabled terminal shelf for application shortcuts and image drop previews"
authors = ["bitzzdev"]
license = "LicenseRef-QuickShelf-Custom"
repository = "https://github.com/bitzzdev/quickShelf"

[dependencies]
glib = "0.18"
gdk-pixbuf = "0.18"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["bracketed-paste"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
